name: Sync Silent1566 WebHTV and Build APK

on:
  schedule:
    # 04:00 Asia/Shanghai = 20:00 UTC previous day
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      build_abi:
        description: "APK ABI"
        required: false
        default: arm64_v8a
        type: choice
        options:
          - arm64_v8a
          - armeabi_v7a

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  UPSTREAM_REPO: https://github.com/Silent1566/webhtv.git
  UPSTREAM_BRANCH: main
  PROTECTED_LIVE_FILES: |
    app/src/mobile/java/com/fongmi/android/tv/ui/activity/LiveActivity.java
    app/src/mobile/java/com/fongmi/android/tv/ui/adapter/EpgDataAdapter.java
    app/src/mobile/res/color/selector_live_epg_text.xml
    app/src/mobile/res/layout/activity_live.xml
    app/src/mobile/res/layout/adapter_epg_data.xml

concurrency:
  group: fongmi-sync-build
  cancel-in-progress: false

jobs:
  sync-build:
    name: Sync upstream and build mobile APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream, preserve local live files
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM_REPO" "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          merged_upstream=false
          if git merge-base --is-ancestor "refs/remotes/upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Upstream is already included."
          else
            git merge --no-edit --no-ff --no-commit "refs/remotes/upstream/$UPSTREAM_BRANCH" || {
              echo "::error title=Upstream merge conflict::Resolve manually; no push was attempted."
              git merge --abort || true
              exit 1
            }
            merged_upstream=true
          fi

          # These files are maintained locally. Restore their pre-merge HEAD
          # versions after every upstream merge, including non-conflicting ones.
          if [ "$merged_upstream" = true ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git cat-file -e "HEAD^:$path" || {
                echo "::error title=Protected live file missing::${path} is not present in the pre-merge commit."
                exit 1
              }
              git restore --source=HEAD^ --staged --worktree -- "$path"
              git add -- "$path"
              echo "Preserved local live file: $path"
            done <<< "$PROTECTED_LIVE_FILES"
            git commit --no-edit
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Build mobile APK
        env:
          BUILD_ABI: ${{ inputs.build_abi || 'arm64_v8a' }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew ":app:assembleMobile${BUILD_ABI^}Debug" --no-daemon

      - name: Commit synced source
        run: |
          set -euo pipefail
          if git diff --quiet HEAD^ HEAD 2>/dev/null; then
            echo "No source changes to commit."
          else
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-mobile-${{ inputs.build_abi || 'arm64_v8a' }}-debug-with-fongmi-live
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
