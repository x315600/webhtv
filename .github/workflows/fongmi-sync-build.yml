name: Sync Silent1566 WebHTV and Build APK

on:
  schedule:
    # 04:00 Asia/Shanghai = 20:00 UTC previous day
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      build_abi:
        description: "APK ABI"
        required: false
        default: arm64_v8a
        type: choice
        options:
          - arm64_v8a
          - armeabi_v7a

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  UPSTREAM_REPO: https://github.com/Silent1566/webhtv.git
  UPSTREAM_BRANCH: main
  PROTECTED_LIVE_FILES: |
    app/src/mobile/java/com/fongmi/android/tv/ui/activity/LiveActivity.java
    app/src/mobile/java/com/fongmi/android/tv/ui/adapter/ChannelAdapter.java
    app/src/mobile/java/com/fongmi/android/tv/ui/adapter/EpgDataAdapter.java
    app/src/mobile/java/com/fongmi/android/tv/ui/adapter/GroupAdapter.java
    app/src/mobile/java/com/fongmi/android/tv/ui/custom/CustomKeyDownLive.java
    app/src/mobile/java/com/fongmi/android/tv/ui/custom/CustomLeftRightLayout.java
    app/src/mobile/java/com/fongmi/android/tv/ui/custom/CustomLiveListView.java
    app/src/mobile/java/com/fongmi/android/tv/ui/custom/CustomUpDownView.java
    app/src/mobile/java/com/fongmi/android/tv/ui/dialog/LiveDialog.java
    app/src/mobile/java/com/fongmi/android/tv/ui/dialog/PlayerOsdDialog.java
    app/src/mobile/res/color/text.xml
    app/src/mobile/res/drawable/ic_widget_error.xml
    app/src/mobile/res/drawable/selector_chip.xml
    app/src/mobile/res/drawable/selector_live.xml
    app/src/mobile/res/drawable/shape_chip_activated.xml
    app/src/mobile/res/drawable/shape_chip_focused.xml
    app/src/mobile/res/drawable/shape_chip_normal.xml
    app/src/mobile/res/drawable/shape_live_focused.xml
    app/src/mobile/res/layout-land/activity_live.xml
    app/src/mobile/res/layout/activity_live.xml
    app/src/mobile/res/layout/adapter_channel.xml
    app/src/mobile/res/layout/adapter_epg_data.xml
    app/src/mobile/res/layout/adapter_group.xml
    app/src/mobile/res/layout/dialog_live.xml
    app/src/mobile/res/layout/view_control_live.xml
    app/src/mobile/res/layout/view_control_live_action.xml
    app/src/mobile/res/layout/view_widget_live.xml

concurrency:
  group: fongmi-sync-build
  cancel-in-progress: false

jobs:
  sync-build:
    name: Sync upstream and build mobile APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream, preserve local live files
        id: sync
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM_REPO" "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "refs/remotes/upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Upstream is already included."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          protected_head="$(git rev-parse HEAD)"
          echo "protected_head=${protected_head}" >> "$GITHUB_OUTPUT"
          git merge --no-edit --no-ff --no-commit "refs/remotes/upstream/$UPSTREAM_BRANCH" || true

          # Restore the complete, verified mobile TV live / EPG implementation.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git cat-file -e "$protected_head:$path" || {
              echo "::error title=Protected live file missing::${path} is not present in ${protected_head}."
              git merge --abort || true
              exit 1
            }
            git restore --source="$protected_head" --staged --worktree -- "$path"
            git add -- "$path"
            echo "Preserved local live file: $path"
          done <<< "$PROTECTED_LIVE_FILES"

          # Pin CI definitions to this fork. The default GITHUB_TOKEN cannot create
          # or update files under .github/workflows/, so any upstream workflow change
          # would make the later push fail with "refusing to allow a GitHub App to
          # create or update workflow ... without `workflows` permission".
          rm -rf .github/workflows
          git rm -r -q -f --cached --ignore-unmatch -- .github/workflows
          git checkout "$protected_head" -- .github/workflows
          git add -A -- .github/workflows
          echo "Pinned .github/workflows to ${protected_head}."

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "::error title=Upstream merge conflict::Non-live conflicts remain; no push was attempted."
            printf '%s\n' "$unresolved"
            git merge --abort || true
            exit 1
          fi

          git commit -m "Merge Silent1566/main, preserve mobile TV live UI, pin fork CI"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify fork CI definitions untouched
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          drift="$(git diff --name-only "${{ steps.sync.outputs.protected_head }}" HEAD -- .github/workflows)"
          if [ -n "$drift" ]; then
            echo "::error title=Workflow drift::Merge changed CI files; the push would be rejected."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Fork CI definitions unchanged."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Build mobile APK
        env:
          BUILD_ABI: ${{ inputs.build_abi || 'arm64_v8a' }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew ":app:assembleMobile${BUILD_ABI^}Debug" --no-daemon

      - name: Push verified synced source
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Publish stable in-app update
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android-release.yml \
            --ref main \
            -f release_channel=stable \
            -f prerelease=false \
            -f sync_cnb=false \
            -f release_notes="自动同步 Silent1566/webhtv 上游，并保留手机版电视直播与 EPG 界面。"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-mobile-${{ inputs.build_abi || 'arm64_v8a' }}-debug-with-fongmi-live
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
