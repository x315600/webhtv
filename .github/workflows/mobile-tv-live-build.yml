name: Build Mobile TV Live UI

on:
  push:
    branches:
      - build/mobile-tv-live-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-tv-live-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mobile arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Build mobile arm64 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleMobileArm64_v8aDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-mobile-tv-live-ui-arm64-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
